name: publish character-namegen to npm

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ports/ts
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12

      # Caching is intentionally disabled for release builds.

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: stamp version from tag
        run: pnpm pkg set version="${GITHUB_REF_NAME#v}"
      - run: pnpm run generate
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - name: stage publish to npm
        run: npm stage publish --access public --provenance

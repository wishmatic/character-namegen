name: character-namegen CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod download
      - run: go build ./...
      - run: go vet ./...

  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod download
      - run: go test ./... -race -count=1

  ts-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ports/ts
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ports/ts/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run generate
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
